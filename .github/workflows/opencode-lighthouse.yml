name: Scheduled Lighthouse Check

on:
  schedule:
    - cron: '0 2 * * *' # nightly at 02:00 UTC
  workflow_dispatch: {} # manual run at any time

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: back

      - name: Build frontend
        run: npm run front:build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun
        continue-on-error: true

      - name: Report Lighthouse status
        if: always()
        run: |
          if [ -d .lighthouseci ] && [ -n "$(ls -A .lighthouseci 2>/dev/null)" ]; then
            echo "Lighthouse report generated:"
            ls -la .lighthouseci
          else
            echo "WARNING: .lighthouseci/ is missing or empty — no Lighthouse report produced."
          fi

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  opencode:
    needs: lighthouse
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Lighthouse report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-report
          path: .lighthouseci

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash
          use_github_token: true
          prompt: |
            You are generating a morning report from a nightly Lighthouse run.
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Rules:
            - Do NOT read or explore the application source code.
            - Do NOT inspect environment variables, tokens, or the action internals.
            - GitHub CLI (gh) is already authenticated — use it directly.

            If .lighthouseci/ contains JSON reports:
            1. Read ONLY the .lighthouseci/*.json files (the median run is enough).
            2. Extract category scores: performance, accessibility, best-practices, SEO.
            3. From the failing audits, list up to 5 concrete, prioritized fixes for the front/ SPA.
            4. Open exactly ONE issue with `gh issue create`, title
               "Lighthouse report <YYYY-MM-DD>", body = scores + fixes + the run URL.
            Then STOP. Do not open PRs or branches, and make no further tool calls.

            If .lighthouseci/ is missing or empty:
            - Open exactly ONE issue with `gh issue create`, titled
              "Lighthouse check failed <YYYY-MM-DD>", body = the run URL and a request
              to investigate the lighthouse job. Then STOP.
