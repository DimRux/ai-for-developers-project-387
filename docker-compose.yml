services:
  back:
    build: ./back
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=file:./dev.db
      - FRONT_ORIGIN=http://localhost:8080
      - PORT=3000
      - OWNER_TIMEZONE=Europe/Moscow
      - OWNER_WORKING_HOURS_START=10:00:00
      - OWNER_WORKING_HOURS_END=19:00:00
      - OWNER_SLOT_STEP_MINUTES=30
      - OWNER_BOOKING_WINDOW_DAYS=14
      - SEED_DEMO=true
    volumes:
      - back-data:/app
    restart: unless-stopped

  front:
    build:
      context: ./front
      args:
        - VITE_API_PROXY_TARGET=http://back:3000
    ports:
      - '8080:80'
    depends_on:
      - back
    restart: unless-stopped

volumes:
  back-data:
